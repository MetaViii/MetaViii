name: Update contribution snake

on:
  schedule:
    - cron: '27 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Render original contribution snake (light and dark)
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake.svg
            assets/github-snake-dark.svg?palette=github-dark
      - name: Publish changes
        run: |
          git add -- assets/github-snake.svg assets/github-snake-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Update contribution snake'
          git push origin HEAD:refs/heads/main
